<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DeepSeek 笔记生成器</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;background:linear-gradient(135deg,#1a1a2e,#16213e);color:#eee;min-height:100vh;padding:20px}
.wrap{max-width:680px;margin:0 auto}
h1{text-align:center;color:#4a9eff;font-size:26px;margin:16px 0;letter-spacing:1px}
.box{background:#0f3460;border-radius:16px;padding:24px;margin-bottom:14px;box-shadow:0 8px 32px rgba(0,0,0,0.4)}
.box h2{font-size:13px;color:#4a9eff;margin-bottom:10px;letter-spacing:0.5px}
textarea{width:100%;background:#1a1a2e;border:1px solid #333;border-radius:10px;padding:14px;color:#ddd;font-size:14px;line-height:1.8;resize:vertical;min-height:130px;outline:none;transition:border .2s}
textarea:focus{border-color:#4a9eff;box-shadow:0 0 0 3px rgba(74,158,255,.15)}
textarea::placeholder{color:#555}
.row{display:flex;gap:10px;margin-top:12px}
.btn{padding:11px 24px;border-radius:10px;border:none;font-size:14px;font-weight:600;cursor:pointer;transition:all .2s}
.btn-pri{background:#4a9eff;color:#fff}
.btn-pri:hover{background:#3a8eef}
.btn-pri:disabled{opacity:.5;cursor:not-allowed}
.btn-ghost{background:#1a1a2e;color:#999;border:1px solid #333}
.btn-ghost:hover{background:#2a2a3e}
.tips{font-size:12px;color:#555;margin-top:8px}
.res{background:#1a1a2e;border-radius:10px;padding:16px;margin-top:14px;font-size:14px;line-height:1.9;white-space:pre-wrap;word-break:break-word;max-height:450px;overflow-y:auto;border:1px solid #333;color:#ddd}
.res:empty{color:#555;font-style:italic;text-align:center;padding:40px}
.res-title{font-size:13px;color:#888;margin-bottom:8px}
.msg{font-size:13px;margin-top:10px;text-align:center;min-height:20px}
.msg.ok{color:#51cf66}
.msg.err{color:#ff6b6b}
.msg.loading{color:#4a9eff}
.spinner{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle;margin-right:4px}
@keyframes spin{to{transform:rotate(360deg)}}
.quick{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.q{background:#1a1a2e;border:1px solid #333;color:#777;font-size:12px;padding:5px 12px;border-radius:20px;cursor:pointer}
.q:hover{border-color:#4a9eff;color:#4a9eff}
.info{font-size:12px;color:#444;text-align:center;margin-top:20px}
.info a{color:#4a9eff;text-decoration:none}
.hidden{display:none}
</style>
</head>
<body>
<div class="wrap">
<h1>🤖 DeepSeek 笔记生成器</h1>

<div class="box">
<h2>📝 输入提示词</h2>
<div class="quick">
<button class="q" onclick="prompt.value='整理一份 学习笔记，包含核心概念、实战案例、常见问题'">📚 学习笔记</button>
<button class="q" onclick="prompt.value='写一份 项目总结，包含背景、进展、问题、下一步'">📋 项目总结</button>
<button class="q" onclick="prompt.value='制定 周报，包含本周完成、下周计划、风险评估'">📅 周报</button>
<button class="q" onclick="prompt.value='整理 竞品分析，包含功能对比、优劣势、定价策略'">🔍 竞品分析</button>
</div>
<textarea id="prompt" placeholder="输入你想生成的内容，例如：整理一份 Python 完整学习路线图..."></textarea>
<div class="tips">Ctrl + Enter 快速生成 | 生成后自动保存到 Obsidian</div>
<div class="row">
<button class="btn btn-pri" id="genBtn" onclick="generate()">🚀 生成</button>
<button class="btn btn-ghost" onclick="prompt.value='';resultEl.textContent='';resultBox.classList.add('hidden');msgEl.textContent=''">清空</button>
</div>
<div class="msg" id="msg"></div>
</div>

<div class="box hidden" id="resultBox">
<div class="res-title">📄 生成结果（已自动保存到 Obsidian）</div>
<div class="res" id="result"></div>
<div class="row" style="margin-top:12px">
<button class="btn btn-ghost" onclick="saveAgain()">💾 重新保存</button>
<button class="btn btn-ghost" onclick="copyResult()">📋 复制</button>
<button class="btn btn-ghost" onclick="prompt.value=resultEl.textContent">✏️ 编辑提示词</button>
</div>
</div>

<div class="info">💡 打开 Obsidian 即可看到生成的笔记 | <a href="obsidian://open?vault=Obsidian%20Vault">打开 Obsidian</a></div>
</div>

<script>
const API_KEY = "sk-e6a62d4c92224761abb59a339f1896ca";
const REST_KEY = "8b64de8e96add01b70a97a197c20622f5021300653878eb145e2d3db72f0eb74";
const REST = "https://127.0.0.1:27124";

const prompt = document.getElementById("prompt");
const genBtn = document.getElementById("genBtn");
const resultEl = document.getElementById("result");
const resultBox = document.getElementById("resultBox");
const msgEl = document.getElementById("msg");

let savedText = "";
let savedFilename = "";

function show(msg, type) {
  if (type === "loading") {
    msgEl.innerHTML = '<span class="spinner"></span>' + msg;
    msgEl.className = "msg loading";
  } else {
    msgEl.textContent = msg;
    msgEl.className = "msg " + (type || "");
  }
}

async function generate() {
  const p = prompt.value.trim();
  if (!p) { show("请输入提示词", "err"); return; }

  genBtn.disabled = true;
  genBtn.textContent = "生成中...";
  show("DeepSeek 思考中...", "loading");

  try {
    const r = await fetch("https://api.deepseek.com/chat/completions", {
      method: "POST",
      headers: { "Content-Type": "application/json", "Authorization": "Bearer " + API_KEY },
      body: JSON.stringify({ model: "deepseek-chat", messages: [{ role: "user", content: p }], stream: false, max_tokens: 3000, temperature: 0.7 })
    });

    if (!r.ok) {
      const e = await r.json().catch(() => ({}));
      throw new Error(e?.error?.message || "HTTP " + r.status);
    }

    const d = await r.json();
    const t = d?.choices?.[0]?.message?.content;
    if (!t) throw new Error("生成结果为空");

    savedText = t;
    resultEl.textContent = t;
    resultBox.classList.remove("hidden");

    // 自动保存
    await autoSave(p, t);
    show("生成完成，已保存到 Obsidian！", "ok");

  } catch(e) {
    show("错误: " + e.message, "err");
  } finally {
    genBtn.disabled = false;
    genBtn.textContent = "🚀 生成";
  }
}

async function autoSave(promptText, genText) {
  const now = new Date().toLocaleString("zh-CN");
  const content = "# DeepSeek 生成记录\n\n" +
    "**时间**: " + now + "\n\n" +
    "## 提示词\n" + promptText + "\n\n" +
    "## 生成内容\n" + genText;

  // 用时间戳生成唯一文件名
  const ts = now.replace(/[\/\\:,\s]/g, "-").replace(" ", "_");
  const fname = "DS_" + ts + ".md";

  try {
    show("保存到 Obsidian...", "loading");
    const r = await fetch(REST + "/vault/" + encodeURIComponent(fname), {
      method: "PUT",
      headers: { "Authorization": "Bearer " + REST_KEY, "Content-Type": "application/json" },
      body: JSON.stringify({ content: content })
    });

    if (!r.ok) throw new Error("HTTP " + r.status);
    savedFilename = fname;
  } catch(e) {
    // 保存失败不影响主流程
    console.error("保存失败:", e);
  }
}

async function saveAgain() {
  if (!savedText) return;
  await autoSave(prompt.value.trim(), savedText);
  if (savedFilename) show("已重新保存: " + savedFilename, "ok");
}

function copyResult() {
  if (!savedText) return;
  navigator.clipboard.writeText(savedText).then(
    () => show("已复制到剪贴板", "ok"),
    () => show("复制失败，请手动选择文本", "err")
  );
}

prompt.addEventListener("keydown", e => {
  if (e.key === "Enter" && e.ctrlKey) generate();
  if (e.key === "Escape") { resultBox.classList.add("hidden"); }
});
</script>
</body>
</html>
